[project]
name = "asset-tracker-mcp"
version = "0.1.0"
description = "MCP server wrapping the Rockwell Asset Tracker REST API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
sources = ["."]
