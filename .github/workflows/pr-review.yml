name: AI PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        id: tests
        run: |
          pytest --tb=short --no-header -q 2>&1 | tee test-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Get PR diff
        id: diff
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr-diff.txt
          echo "diff_lines=$(wc -l < pr-diff.txt)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: AI Review
        id: review
        run: python .github/scripts/pr_review_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}

      - name: Simulated dev deploy
        if: steps.tests.outputs.exit_code == '0'
        run: |
          echo "=== DEPLOY TO DEV ==="
          echo "Deploying ${{ github.head_ref }} to dev environment..."
          echo "App URL: https://dev-asset-tracker.rockwell-internal.example/health"
          echo "Deploy complete."

      - name: Post deploy status
        if: steps.tests.outputs.exit_code == '0'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## Dev Deploy Complete

          Branch \`${{ github.head_ref }}\` deployed to dev.
          Preview: https://dev-asset-tracker.rockwell-internal.example

          All checks passed. Ready for human review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
